services:
  frontend:
    image: node:22-alpine
    working_dir: /app
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: sh -c "npm install && npm run dev -- --host"

  # backend:
  #   build:
  #     context: ./backend
  #   ports:
  #     - "8080:8080"
  #   depends_on:
  #     - database
  #   env_file:
  #     - ./backend/.env

  database:
    image: mysql:8
    container_name: etp-db
    environment:
      MYSQL_DATABASE: etp_db
      MYSQL_USER: etp_user
      MYSQL_PASSWORD: etp_password
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    restart: unless-stopped

volumes:
  mysql_data: